# https://hub.docker.com/r/ollama/ollama

services:
  ollama:
    image: ollama/ollama:${OLLAMA_DOCKER_TAG-latest}
    container_name: llm-ollama-container

    volumes:
      - type: volume
        source: ollama
        target: /root/.ollama

    ports:
      - ${OLLAMA_PORT-11434}:11434

    networks:
      - llm_network

    # pull_policy: always
    # restart: unless-stopped

volumes:
  ollama: {}
