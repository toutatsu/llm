# https://github.com/ggml-org/llama.cpp/blob/master/docs/docker.md

services:

  llamacpp:

    # image: ghcr.io/ggml-org/llama.cpp:full
    image: ghcr.io/ggml-org/llama.cpp:server

    container_name: llm-llamacpp-container

    # runtime: nvidia

    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           capabilities: [ gpu ]
    #           device_ids: [ '0', '1' ]

    ports:
      - "${LLAMACPP_SERVER_PORT:-8080}:${LLAMACPP_SERVER_PORT:-8080}"

    volumes:
      - type: bind
        source: ./models
        target: /models

      # - type: bind
      #   source: ~/.cache/huggingface
      #   target: /root/.cache/huggingface

      # environment:
      # - LLAMA_ARG_CTX_SIZE=2048
      # - LLAMA_ARG_MODEL=${LLM_MODEL_NAME}
      # - LLAMA_ARG_N_GPU_LAYERS=99

    # entrypoint: /app/llama-server
    entrypoint: [ /bin/bash ]

    command:
      - -m
      - ${LLMCPP_MODEL_NAME:-/models/7B/ggml-model-q4_0.gguf}

      - --host
      - 0.0.0.0

      - --port
      - ${LLAMACPP_SERVER_PORT:-8080}

      # num tokens
      - -n
      - "10000"

      # context size
      - -c
      - "10000"

      # - -ngl #--n-gpu-layers
      # - "100"
      # - --jinja #	Enable experimental Jinja templating engine (required for tool use)

    networks:
      - llm_network
