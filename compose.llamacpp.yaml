# https://github.com/ggml-org/llama.cpp/blob/master/docs/docker.md

services:

  llamacpp:

    # image: ghcr.io/ggml-org/llama.cpp:full
    image: ghcr.io/ggml-org/llama.cpp:server
    # image: ghcr.io/ggml-org/llama.cpp:server-cuda   # CUDA 12
    # image: ghcr.io/ggml-org/llama.cpp:server-rocm   # ROCm

    container_name: llm-llamacpp-container

    # GPU (CUDA) 使用時はコメントアウトを解除
    # runtime: nvidia

    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           capabilities: [ gpu ]
    #           device_ids: [ '0', '1' ]

    # ホスト側ポートは環境変数で変更可能、コンテナ側は常に 8080
    ports:
      - "${LLAMACPP_SERVER_PORT:-8080}:8080"

    volumes:
      - type: bind
        source: ./models
        target: /models

      # HuggingFace キャッシュをマウントする場合
      # - type: bind
      #   source: ~/.cache/huggingface
      #   target: /root/.cache/huggingface

    environment:
      - LLAMA_ARG_CTX_SIZE=${LLAMACPP_CTX_SIZE:-2048}
      # GPU 使用時
      # - LLAMA_ARG_N_GPU_LAYERS=99

    # server イメージのデフォルトエントリポイントは /app/llama-server
    # entrypoint: /app/llama-server

    # router mode: -m を指定しないことで動的モデルロード/アンロードが有効になる
    command:
      - --host
      - 0.0.0.0

      - --port
      - "8080"

      # ローカルモデルの検索ディレクトリ（router mode でのモデルソース）
      - --models-dir
      - /models

      # 同時ロード上限（デフォルト: 4）
      # - --models-max
      # - "2"

      # - --n-gpu-layers
      # - "100"

      # Jinja テンプレート有効化（ツールユース対応）
      # - --jinja

    networks:
      - llm_network
