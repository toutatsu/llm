[project]
name = "llm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "deepagents>=0.2.7",
    "fastmcp>=2.0.0",
    "langchain-mcp-adapters>=0.1.0",
    "fastapi[standard]>=0.116.1",
    "google-genai>=1.27.0",
    "langchain>=0.3.26",
    "langchain-google-community>=3.0.1",
    "langchain-google-genai>=2.1.8",
    "langchain-ollama>=0.3.6",
    "langchain-openai>=1.0.3",
    "langgraph>=0.5.4",
    "langgraph-checkpoint-postgres>=3.0.1",
    "loguru>=0.7.3",
    "msgpack>=1.1.2",
    "rich>=14.2.0",
    "uvicorn>=0.35.0",
    "prompt-toolkit>=3.0.52",
    "postgres-mcp>=0.3.0",
    "pillow>=11.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.28.0",
]

[project.scripts]
math-server = "llm.mcp.server.math_server:main"
text-server = "llm.mcp.server.text_server:main"
filesystem-server = "llm.mcp.server.filesystem_server:main"
search-server = "llm.mcp.server.search_server:main"
shell-server = "llm.mcp.server.shell_server:main"
datetime-server = "llm.mcp.server.datetime_server:main"
http-server = "llm.mcp.server.http_server:main"
mcp-server = "llm.mcp.server.combined:main"
mcp-demo = "llm.mcp.client.fastmcp_client:main"
mcp-langchain = "llm.mcp.client.langchain_client:main"

[tool.pytest.ini_options]
anyio_mode = "auto"

[tool.uv.workspace]
members = [
    "llm",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "anyio[trio]>=4.0",
]

[tool.uv]
package = true
